<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Consensus Engine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose p { margin-bottom: 0.75rem; }
    .prose ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose pre { background: #0f172a; color: #f8fafc; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin-bottom: 0.75rem; }
    .prose code { font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-3 sm:px-6 py-6 sm:py-10">
    
    <!-- Header (Responsive Stack) -->
    <header class="mb-6 sm:mb-8 border-b border-slate-800 pb-5">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex flex-wrap items-center gap-2 sm:gap-3">
            Consensus Engine
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-0.5 rounded-full font-mono font-medium">TarqaAI Gateway</span>
          </h1>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Simultaneously evaluate two models and synthesize a gold-standard response.</p>
        </div>
        <div class="self-start sm:self-auto">
          <span id="modelCountBadge" class="inline-block text-xs font-mono bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg">
            Loading models...
          </span>
        </div>
      </div>
    </header>

    <!-- Query Controls -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5 mb-6 sm:mb-8 shadow-sm">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Candidate Model A</label>
          <select id="modelA" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Candidate Model B</label>
          <select id="modelB" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div class="sm:col-span-2 lg:col-span-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Arbiter / Judge Model</label>
          <select id="judgeModel" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></select>
        </div>
      </div>

      <div class="mb-4">
        <label for="promptInput" class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Prompt or Technical Question</label>
        <textarea id="promptInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="e.g., Should we choose Redis or PostgreSQL for managing high-throughput rate-limiting counters?"></textarea>
      </div>

      <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <span id="statusMessage" class="text-xs text-slate-400 font-mono text-center sm:text-left"></span>
        <button id="runBtn" class="w-full sm:w-auto justify-center bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition-colors flex items-center gap-2">
          Run Consensus
        </button>
      </div>
    </section>

    <!-- Results Display -->
    <div id="resultsArea" class="hidden space-y-6 sm:space-y-8">
      
      <!-- Side by Side (or Stacked on Mobile) Candidates -->
      <div>
        <h2 class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-3">Model Candidate Outputs</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          
          <!-- Candidate A -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5 flex flex-col justify-between shadow-sm">
            <div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <span id="titleCandidateA" class="font-mono text-xs sm:text-sm text-indigo-400 font-semibold truncate max-w-[70%]">Model A</span>
                <span id="latencyA" class="text-xs font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0ms</span>
              </div>
              <div id="contentCandidateA" class="prose text-sm text-slate-300 leading-relaxed overflow-x-auto"></div>
            </div>
          </div>

          <!-- Candidate B -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5 flex flex-col justify-between shadow-sm">
            <div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <span id="titleCandidateB" class="font-mono text-xs sm:text-sm text-indigo-400 font-semibold truncate max-w-[70%]">Model B</span>
                <span id="latencyB" class="text-xs font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0ms</span>
              </div>
              <div id="contentCandidateB" class="prose text-sm text-slate-300 leading-relaxed overflow-x-auto"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- Arbiter / Judge Synthesis -->
      <div class="bg-gradient-to-b from-indigo-950/40 to-slate-900 border border-indigo-500/30 rounded-xl p-4 sm:p-6 shadow-md">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-indigo-500/20 pb-3 sm:pb-4 mb-4 gap-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <h3 class="font-semibold text-white tracking-wide text-sm sm:text-base">Synthesized Consensus & Arbiter Review</h3>
          </div>
          <div class="flex items-center gap-2 sm:gap-3 self-end sm:self-auto">
            <span id="judgeModelTag" class="text-xs font-mono text-indigo-300">Model</span>
            <span id="latencyJudge" class="text-xs font-mono bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/20">0ms</span>
          </div>
        </div>
        <div id="arbiterContent" class="prose text-sm text-slate-200 leading-relaxed overflow-x-auto"></div>
      </div>

    </div>

  </div>

  <script>
    const runBtn = document.getElementById('runBtn');
    const promptInput = document.getElementById('promptInput');
    const statusMessage = document.getElementById('statusMessage');
    const resultsArea = document.getElementById('resultsArea');
    const modelACtrl = document.getElementById('modelA');
    const modelBCtrl = document.getElementById('modelB');
    const judgeCtrl = document.getElementById('judgeModel');
    const modelCountBadge = document.getElementById('modelCountBadge');

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        const models = data.models || [];

        modelCountBadge.textContent = `${models.length} Models Ready`;

        const populate = (selectElem, defaultVal) => {
          selectElem.innerHTML = '';
          models.forEach(model => {
            const opt = document.createElement('option');
            opt.value = model;
            opt.textContent = model;
            if (model === defaultVal) opt.selected = true;
            selectElem.appendChild(opt);
          });
        };

        populate(modelACtrl, 'gemini-2.5-flash');
        populate(modelBCtrl, models.find(m => m.includes('pro') || (m.includes('flash') && m !== 'gemini-2.5-flash')) || models[1] || models[0]);
        populate(judgeCtrl, 'gemini-2.5-flash');

      } catch (err) {
        console.error('Error loading models:', err);
        modelCountBadge.textContent = 'Model list fallback';
      }
    }

    loadModels();

    runBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return alert('Please enter a question or prompt first.');

      runBtn.disabled = true;
      runBtn.classList.add('opacity-50', 'cursor-not-allowed');
      statusMessage.textContent = 'Querying models concurrently...';
      resultsArea.classList.add('hidden');

      try {
        const payload = {
          prompt,
          modelA: modelACtrl.value,
          modelB: modelBCtrl.value,
          judgeModel: judgeCtrl.value,
        };

        const res = await fetch('/api/consensus', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to fetch consensus.');

        const candidateA = data.candidates[0];
        document.getElementById('titleCandidateA').textContent = candidateA.model;
        document.getElementById('latencyA').textContent = `${candidateA.latency}ms`;
        if (candidateA.error) {
          document.getElementById('contentCandidateA').innerHTML = `<div class="p-3 bg-red-950/40 border border-red-500/30 text-red-300 rounded font-mono text-xs">${candidateA.error}</div>`;
        } else {
          document.getElementById('contentCandidateA').innerHTML = marked.parse(candidateA.content);
        }

        const candidateB = data.candidates[1];
        document.getElementById('titleCandidateB').textContent = candidateB.model;
        document.getElementById('latencyB').textContent = `${candidateB.latency}ms`;
        if (candidateB.error) {
          document.getElementById('contentCandidateB').innerHTML = `<div class="p-3 bg-red-950/40 border border-red-500/30 text-red-300 rounded font-mono text-xs">${candidateB.error}</div>`;
        } else {
          document.getElementById('contentCandidateB').innerHTML = marked.parse(candidateB.content);
        }

        document.getElementById('judgeModelTag').textContent = `Judge: ${data.arbiter.model}`;
        document.getElementById('latencyJudge').textContent = `${data.arbiter.latency}ms`;
        document.getElementById('arbiterContent').innerHTML = marked.parse(data.arbiter.content);

        resultsArea.classList.remove('hidden');
        statusMessage.textContent = 'Completed.';

        // Smooth scroll down to results on mobile devices
        resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        console.error(err);
        statusMessage.textContent = `Error: ${err.message}`;
      } finally {
        runBtn.disabled = false;
        runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
